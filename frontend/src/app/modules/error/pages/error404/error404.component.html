<div class="bg-background flex max-w-lg flex-col items-center justify-center gap-2 rounded-lg p-8 text-center">
  <svg-icon src="assets/illustrations/404.svg" svgClass="w-[300px] h-[150px] text-muted-foreground"> </svg-icon>
  <h1 class="text-foreground text-4xl font-bold">{{ 'errorPages.notFoundTitle' | t }}</h1>
  <p class="text-muted-foreground text-sm">{{ 'errorPages.notFoundBody' | t }}</p>
  <button
    type="button"
    (click)="goToHomePage()"
    class="action-solid action-md mt-2">
    {{ 'errorPages.notFoundButton' | t }}
  </button>
</div>
