<div class="flex h-screen w-screen">
  <div class="auth-bg bg-primary hidden flex-1 items-center justify-center bg-cover lg:flex">
    <div class="max-w-2xl space-y-4 p-8 text-center text-white">
      <!--
        The one place with room for the mark at size. Reversed to white because
        it sits on a filled panel — same drawing, and the counter reads as the
        panel showing through rather than as a hole in nothing.
      -->
      <svg-icon src="assets/icons/logo.svg" [svgClass]="'mx-auto mb-6 h-20 w-auto text-white'"> </svg-icon>
      <h1 class="text-4xl font-bold">{{ 'app.name' | t }}</h1>
      <p class="text-sm font-light">
        {{ 'auth.tagline' | t }}
      </p>
    </div>
  </div>
  <div class="bg-background flex flex-1 items-center justify-center">
    <div class="max-w-md overflow-y-auto px-4 sm:w-[500px]">
      <!-- logo -->
      <div class="flex items-center justify-between gap-3">
        <div class="flex items-center gap-3">
          <svg-icon src="assets/icons/logo.svg" [svgClass]="'text-brand h-8 w-auto'"> </svg-icon>
          <b class="text-md text-foreground font-bold">{{ 'app.name' | t }}</b>
        </div>
        <app-language-switcher />
      </div>
      <!-- Route -->
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
