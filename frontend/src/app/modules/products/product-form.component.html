<form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4" novalidate>
  <div>
    <label for="product-code" class="text-foreground mb-1 block text-sm font-medium">{{ 'productForm.codeLabel' | t }}</label>
    <input
      id="product-code"
      type="text"
      formControlName="code"
      autocomplete="off"
      placeholder="P-1"
      class="disabled:opacity-60"
      [attr.aria-invalid]="errorFor('code') ? 'true' : null"
      [attr.aria-describedby]="errorFor('code') ? 'product-code-error' : null" />
    @if (isEditing()) {
      <p class="text-muted-foreground mt-1 text-xs">{{ 'productForm.codeImmutable' | t }}</p>
    }
    @if (errorFor('code'); as message) {
      <p id="product-code-error" class="text-destructive mt-1 text-xs">{{ message }}</p>
    }
  </div>

  <div>
    <label for="product-description" class="text-foreground mb-1 block text-sm font-medium">{{ 'productForm.descriptionLabel' | t }}</label>
    <input
      id="product-description"
      type="text"
      formControlName="description"
      autocomplete="off"
      [placeholder]="'productForm.descriptionPlaceholder' | t"
      [attr.aria-invalid]="errorFor('description') ? 'true' : null"
      [attr.aria-describedby]="errorFor('description') ? 'product-description-error' : null" />
    @if (errorFor('description'); as message) {
      <p id="product-description-error" class="text-destructive mt-1 text-xs">{{ message }}</p>
    }
  </div>

  <div>
    <label for="product-balance" class="text-foreground mb-1 block text-sm font-medium">{{ 'productForm.balanceLabel' | t }}</label>
    <input
      id="product-balance"
      type="number"
      inputmode="numeric"
      min="0"
      step="1"
      formControlName="balance"
      [attr.aria-invalid]="errorFor('balance') ? 'true' : null"
      [attr.aria-describedby]="errorFor('balance') ? 'product-balance-error' : null" />
    @if (errorFor('balance'); as message) {
      <p id="product-balance-error" class="text-destructive mt-1 text-xs">{{ message }}</p>
    }
  </div>

  @if (failure(); as error) {
    <div role="alert" class="notice-tight border-destructive/40 bg-destructive/10 text-destructive">
      {{ error | apiError }}
    </div>
  }

  <div class="flex justify-end gap-2 pt-2">
    <button
      type="button"
      (click)="cancelled.emit()"
      class="action-outline action-md">
      {{ 'common.cancel' | t }}
    </button>
    <button type="submit" [disabled]="saving()" class="action-solid action-md">
      {{ saving() ? ('productForm.saving' | t) : isEditing() ? ('productForm.saveChanges' | t) : ('productForm.registerProduct' | t) }}
    </button>
  </div>
</form>
