<!--
  Keyboard users land on the sidebar on every page and have to tab past the
  whole menu to reach the table they came for. This skips it, and only shows
  itself once it has focus.
-->
<a
  href="#main-content"
  class="bg-primary text-primary-foreground sr-only rounded-md px-4 py-2 text-sm font-semibold focus:not-sr-only focus:absolute focus:left-4 focus:top-4 focus:z-50">
  {{ 'layout.skipToContent' | t }}
</a>

<div class="flex h-screen w-full overflow-hidden">
  <!-- Sidebar -->
  <app-sidebar></app-sidebar>

  <div class="flex grow flex-col content-start overflow-hidden bg-card">
    <!-- Header -->
    <app-navbar></app-navbar>
    <!-- main content -->
    <main
      id="main-content"
      tabindex="-1"
      class="scrollbar-thumb-rounded scrollbar-track-rounded grow overflow-auto scrollbar-thin scrollbar-track-transparent scrollbar-thumb-muted">
      <div class="mx-auto px-4 py-4 sm:px-8 lg:container">
        <router-outlet></router-outlet>
      </div>
    </main>

    <!-- Bottom bar -->
    <!-- <app-bottom-navbar></app-bottom-navbar> -->
  </div>
</div>
