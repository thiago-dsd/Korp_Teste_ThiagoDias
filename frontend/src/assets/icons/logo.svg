<!--
  The Korp mark: the initial drawn as a circle set against an angular stem,
  with the counter between them left open so the background reads through it.

  Taken from `logo-initial.svg` unchanged — same path, same proportions. Only
  the colour is lifted out to `currentColor`, so one file serves the brand red
  it is normally shown in and the white it takes on a coloured tile (the
  favicon). Nothing here is redrawn for size: it is a single silhouette with
  one counter, which is what lets it hold together small, and why there is no
  separate small-size variant to keep in step.

  The viewBox is very nearly square (1129 x 1125). Size it by height and let
  the width follow, never by both, or the circle stops being a circle. It needs
  no padding of its own: the empty top-left and bottom-right corners are part
  of the drawing and already give it room to breathe.
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1129 1125"
  fill="currentColor"
  role="img"
  aria-label="Stockly">
  <path
    d="M363.063 390C366.74 595.133 531.689 760.897 736.5 765.883V1125H372C360.193 843.738 292.431 751.073 0 754.5V390H363.063ZM746 0C957.525 0 1129 171.475 1129 383C1129 594.525 957.525 766 746 766C742.824 766 739.657 765.96 736.5 765.883V390H363.063C363.022 387.672 363 385.338 363 383C363 171.475 534.475 0 746 0Z" />
</svg>
