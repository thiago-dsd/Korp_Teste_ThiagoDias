# Local infrastructure for the invoice system.
# Credentials here are development only and must never be reused elsewhere.
services:
  postgres:
    image: postgres:17-alpine
    container_name: korp-postgres
    environment:
      POSTGRES_USER: korp
      POSTGRES_PASSWORD: korp
      POSTGRES_DB: postgres
    ports:
      # 5433 on the host keeps this project independent of any other local
      # PostgreSQL already bound to the default port.
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U korp -d postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: korp-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: korp
      RABBITMQ_DEFAULT_PASS: korp
    ports:
      - '5672:5672' # AMQP
      - '15672:15672' # management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 10s
      retries: 10

  # The three services run under the "services" profile, so `make infra-up`
  # still brings up only the infrastructure for local development against
  # `go run`, while `docker compose --profile services up` runs the whole
  # system without a Go toolchain on the machine.
  identity-service:
    build:
      context: ./backend
      args:
        SERVICE: identity-service
    profiles: ['services']
    environment:
      HTTP_ADDR: ':8083'
      DATABASE_URL: postgres://korp:korp@postgres:5432/identity?sslmode=disable
      SERVICE_TOKEN: local-development-token
      CORS_ALLOWED_ORIGINS: http://localhost:4200
    ports: ['8083:8083']
    depends_on:
      postgres: {condition: service_healthy}

  stock-service:
    build:
      context: ./backend
      args:
        SERVICE: stock-service
    profiles: ['services']
    environment:
      HTTP_ADDR: ':8081'
      DATABASE_URL: postgres://korp:korp@postgres:5432/stock?sslmode=disable
      RABBITMQ_URL: amqp://korp:korp@rabbitmq:5672/
      SERVICE_TOKEN: local-development-token
      IDENTITY_SERVICE_URL: http://identity-service:8083
      CORS_ALLOWED_ORIGINS: http://localhost:4200
    ports: ['8081:8081']
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}

  billing-service:
    build:
      context: ./backend
      args:
        SERVICE: billing-service
    profiles: ['services']
    environment:
      HTTP_ADDR: ':8082'
      DATABASE_URL: postgres://korp:korp@postgres:5432/billing?sslmode=disable
      RABBITMQ_URL: amqp://korp:korp@rabbitmq:5672/
      SERVICE_TOKEN: local-development-token
      STOCK_SERVICE_URL: http://stock-service:8081
      IDENTITY_SERVICE_URL: http://identity-service:8083
      CORS_ALLOWED_ORIGINS: http://localhost:4200
      AZURE_AI_FOUNDRY_ENDPOINT: ${AZURE_AI_FOUNDRY_ENDPOINT:-}
      AZURE_AI_FOUNDRY_API_KEY: ${AZURE_AI_FOUNDRY_API_KEY:-}
      AZURE_AI_FOUNDRY_DEPLOYMENT: ${AZURE_AI_FOUNDRY_DEPLOYMENT:-}
    ports: ['8082:8082']
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}

volumes:
  postgres-data:
  rabbitmq-data:
